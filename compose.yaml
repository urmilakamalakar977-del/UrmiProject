services:
  web:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - ecom_data:/app/data
      - ecom_media:/app/media
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn ecom.wsgi:application --bind 0.0.0.0:8000 --workers 2
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/products/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ecom_data:
  ecom_media:
